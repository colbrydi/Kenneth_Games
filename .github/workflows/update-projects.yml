name: Update Scratch Projects

on:
  schedule:
    # Run daily at 2 AM UTC (adjust time as needed)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub

jobs:
  update-projects:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Fetch Scratch projects and user data
        id: fetch
        run: |
          # Fetch projects from Scratch API
          PROJECTS=$(curl -s "https://api.scratch.mit.edu/users/KenRemoLC/projects?limit=40")
          echo "$PROJECTS" | jq '[.[] | {id: (.id | tostring), title: .title, description: (.description | if . then . else "" end), featured: false}]' > projects.json
          
          # Fetch user profile from Scratch API
          USER=$(curl -s "https://api.scratch.mit.edu/users/KenRemoLC/")
          echo "$USER" | jq '{username: .username, profileImageUrl: .profile.images["90x90"]}' > user.json
          
          echo "Updated $(jq 'length' projects.json) projects"
          echo "Fetched user: $(jq -r .username user.json)"
      
      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          if git diff --quiet projects.json user.json; then
            echo "No changes to projects or user data"
          else
            echo "Updates detected, committing..."
            git add projects.json user.json
            git commit -m "Update projects and user data from Scratch API"
            git push
          fi
