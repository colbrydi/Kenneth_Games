<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="A gallery of Scratch programming projects">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Game Gallery">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%231a1a1a' width='192' height='192'/><text x='96' y='110' font-size='80' font-weight='bold' fill='%23ff6b6b' text-anchor='middle' font-family='system-ui'>G</text></svg>">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>Game Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Game Gallery</h1>
        <p class="user-info">
            by 
            <a href="" id="user-link" target="_blank" rel="noopener noreferrer" class="username">
                <img id="user-icon" class="user-icon" alt="" loading="eager">
                <span id="username-text"></span>
            </a>
        </p>
    </header>

    <main>
        <div id="games-container" class="games-grid"></div>
        <div id="error-message" class="error-hidden"></div>
    </main>

    <footer>
        <p>Powered by MIT Scratch</p>
        <p style="font-size: 0.8rem; color: #666; margin-top: 1rem;">Built with <a href="https://github.com/copilot" style="color: #999; text-decoration: none;">GitHub Copilot</a></p>
    </footer>

    <script src="CONFIG.js"></script>
    <script src="script.js"></script>
</body>
</html>
